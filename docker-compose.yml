version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ev_recommendation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend
    container_name: ev_osrm
    ports:
      - "5000:5000"
    volumes:
      - ./runtime/osrm:/data
    command: >
      osrm-routed --algorithm mld /data/hanoi-baseline.osrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000route/v1/driving/0,0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ev_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ev_recommendation
      - OSRM_BASE_URL=http://osrm:5000
      - DATASET_PATH=/app/dataset_v1
      - PRIMARY_PBF_PATH=/app/dataset_v1/map/raw/hanoi-baseline.osm.pbf
      - OSRM_DATA_PATH=/app/runtime/osrm
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./dataset_v1:/app/dataset_v1:ro
      - ./runtime/osrm:/app/runtime/osrm:ro
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
