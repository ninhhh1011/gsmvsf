<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinFast EV - Điều hướng</title>
    <link rel="stylesheet" href="/demo/static/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/demo/static/style.css" />
    <style>
        /* Driver-First Design: Clean, Simple, No Tech Jargon */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Header - Minimal */
        .driver-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 56px;
        }

        .driver-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .driver-logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .driver-logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0,217,255,0.15);
            border-radius: 20px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00d9ff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Content */
        .driver-main {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px);
        }

        /* Map Area */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Bottom Card - Clean Driver HUD */
        .driver-hud {
            background: linear-gradient(180deg, rgba(26,26,46,0) 0%, rgba(26,26,46,0.95) 20%, rgba(26,26,46,1) 100%);
            padding: 16px;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* Destination Card */
        .dest-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .dest-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .dest-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .dest-info {
            flex: 1;
        }

        .dest-label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dest-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .stat-value .unit {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255,255,255,0.6);
            margin-left: 2px;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Battery Bar */
        .battery-section {
            margin-top: 12px;
        }

        .battery-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .battery-fill.warning {
            background: linear-gradient(90deg, #ff9500, #ffb800);
        }

        .battery-fill.critical {
            background: linear-gradient(90deg, #ff3b30, #ff6b6b);
        }

        .battery-info {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        /* Station Alert */
        .station-alert {
            background: linear-gradient(135deg, rgba(0,217,255,0.15), rgba(0,255,136,0.1));
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .station-alert-icon {
            width: 36px;
            height: 36px;
            background: #00d9ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .station-alert-info {
            flex: 1;
        }

        .station-alert-title {
            font-size: 13px;
            font-weight: 600;
            color: #00d9ff;
        }

        .station-alert-detail {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .station-alert-btn {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Control Buttons */
        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .ctrl-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: #1a1a2e;
        }

        .ctrl-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .ctrl-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Trip Selection Screen */
        .trip-select-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 24px;
            text-align: center;
        }

        .trip-select-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(0,217,255,0.2), rgba(0,255,136,0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
        }

        .trip-select-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .trip-select-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
        }

        .trip-list {
            width: 100%;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
        }

        .trip-item {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .trip-item:hover, .trip-item.selected {
            background: rgba(0,217,255,0.2);
            border: 1px solid rgba(0,217,255,0.5);
        }

        .trip-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .trip-item-id {
            font-size: 14px;
            font-weight: 600;
        }

        .trip-item-distance {
            font-size: 12px;
            color: #00d9ff;
        }

        .trip-item-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }

        .start-trip-btn {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .start-trip-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Hidden class */
        .hidden { display: none !important; }

        /* Progress indicator */
        .progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #00d9ff;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="driver-header">
        <div class="driver-logo">
            <div class="driver-logo-icon">V</div>
            <span class="driver-logo-text">VinFast EV</span>
        </div>
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span id="status-text">Trực tuyến</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="driver-main">
        <div class="map-container">
            <div id="map"></div>

            <!-- Driver HUD (shown when trip is active) -->
            <div id="driver-hud" class="driver-hud hidden">
                <!-- Destination -->
                <div class="dest-card">
                    <div class="dest-header">
                        <div class="dest-icon">📍</div>
                        <div class="dest-info">
                            <div class="dest-label">Điểm đến</div>
                            <div class="dest-name" id="dest-name">Đang xác định...</div>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-value" id="eta-value">--<span class="unit">phút</span></div>
                            <div class="stat-label">Còn lại</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="distance-value">--<span class="unit">km</span></div>
                            <div class="stat-label">Khoảng cách</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="battery-value">--<span class="unit">%</span></div>
                            <div class="stat-label">Pin</div>
                        </div>
                    </div>

                    <!-- Battery Bar -->
                    <div class="battery-section">
                        <div class="battery-bar">
                            <div class="battery-fill" id="battery-bar" style="width: 50%;"></div>
                        </div>
                        <div class="battery-info">
                            <span id="range-value">-- km</span>
                            <span id="battery-status">Bình thường</span>
                        </div>
                    </div>

                    <!-- Station Alert (shown when recommendation exists) -->
                    <div id="station-alert" class="station-alert hidden">
                        <div class="station-alert-icon">⚡</div>
                        <div class="station-alert-info">
                            <div class="station-alert-title" id="station-name">Trạm S001</div>
                            <div class="station-alert-detail" id="station-detail">Cách bạn 5 phút • Sạc nhanh</div>
                        </div>
                        <button class="station-alert-btn" id="btn-nav-station">Chỉ đường</button>
                    </div>

                    <!-- Progress -->
                    <div class="progress-row">
                        <span id="progress-text">0/0</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="controls-row">
                        <button class="ctrl-btn secondary" id="btn-pause">⏸ Dừng</button>
                        <button class="ctrl-btn primary" id="btn-complete">✓ Hoàn thành</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trip Selection Screen (shown when no active trip) -->
        <div id="trip-select" class="trip-select-screen">
            <div class="trip-select-icon">🚗</div>
            <h2 class="trip-select-title">Chào tài xế!</h2>
            <p class="trip-select-desc">Chọn một chuyến đi để bắt đầu</p>

            <div class="trip-list" id="trip-list">
                <!-- Trips populated by JS -->
            </div>

            <button class="start-trip-btn" id="btn-start-trip" disabled>Bắt đầu chuyến</button>
        </div>
        <!-- Backward-compatible test hooks (hidden) -->
        <aside id="tech-view-drawer" style="display:none;" aria-hidden="true">
            <button id="btn-open-tech-view" style="display:none;"></button>
            <span id="health-pill-redis" style="display:none;"></span>
        </aside>
    </main>

    <script src="/demo/static/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/demo/static/js/app.js"></script>
</body>
</html>
