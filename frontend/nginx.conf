upstream backend_cluster {
    least_conn;
    server api_1:8000 max_fails=2 fail_timeout=5s;
    server api_2:8000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Dedicated Nginx health check for container readiness
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Reverse proxy API requests to FastAPI backend cluster with failover
    location /api/ {
        proxy_pass http://backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health and readiness endpoints proxied to backend cluster with failover
    location /health {
        proxy_pass http://backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /readiness {
        proxy_pass http://backend_cluster/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Static UI assets under /demo/static
    location /demo/static/ {
        alias /usr/share/nginx/html/;
    }

    # Static UI assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
